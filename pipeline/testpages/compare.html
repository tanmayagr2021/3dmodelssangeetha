<!doctype html>
<html><head><meta charset="utf-8">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>html,body{margin:0;background:#fff}#box{width:600px;height:800px;background:#fff}model-viewer{width:100%;height:100%;--poster-color:transparent;background:#fff}</style>
</head><body>
<div id="box"><model-viewer id="mv" shadow-intensity="1" shadow-softness="0.8" environment-image="neutral" exposure="1.05" interaction-prompt="none" field-of-view="18deg"></model-viewer></div>
<script type="module">
// test page: renders a model from a given orbit, optionally posed at the end of a clip
const q = new URLSearchParams(location.search);
const mv = document.getElementById("mv");
mv.cameraOrbit = q.get("orbit") || "0deg 90deg auto";
if (q.get("w")) { document.getElementById("box").style.width = q.get("w") + "px"; document.getElementById("box").style.height = q.get("h") + "px"; }
mv.src = q.get("src");
mv.addEventListener("load", async () => {
  const a = q.get("anim");
  if (a) { mv.animationName = a; await mv.updateComplete; mv.currentTime = 0; mv.play({ repetitions: 1 }); await new Promise((r) => setTimeout(r, 1600)); }
  window.__ready = true;
});
</script>
</body></html>
